services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lendai_dev
      POSTGRES_DB: lendai
    ports:
      - "5432:5432"
    volumes:
      - lendai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:lendai_dev@postgres:5432/lendai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/load_data.py &&
             python -m app.ml.train &&
             python scripts/export_lite_models.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  lendai_pg_data:
